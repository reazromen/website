- id: BLOCK3
  label: My VoIP work covers more than PBX configuration. A call crosses independent
    signaling, routing,
  body: My VoIP work covers more than PBX configuration. A call crosses independent
    signaling, routing, media, network and endpoint components. SIP signaling and
    RTP media often follow different paths, so a successful INVITE does not prove
    working audio.
- id: BLOCK4
  label: The symptom is not the layer.
  body: The symptom is not the layer.
- id: BLOCK5
  label: Troubleshooting requires separating registration, authentication, SIP routing,
    SDP negotiation,
  body: Troubleshooting requires separating registration, authentication, SIP routing,
    SDP negotiation, codec selection, NAT, RTP ports, packet flow, jitter, media timing
    and endpoint behavior. A system can be correct at one layer and broken at another.
