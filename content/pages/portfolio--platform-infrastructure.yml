- id: BLOCK3
  label: As the number of services increased, managing the environment through individual
    Docker command
  body: 'As the number of services increased, managing the environment through individual
    Docker commands, dashboards and authentication flows stopped being efficient.
    The problem became operational: how to understand the state of the system and
    control it without manually visiting every service.'
- id: BLOCK4
  label: The symptom is not the layer.
  body: The symptom is not the layer.
- id: BLOCK5
  label: A running container is only one signal. The process can exist while the HTTP
    endpoint is unreac
  body: A running container is only one signal. The process can exist while the HTTP
    endpoint is unreachable, a dependency has failed, DNS is broken, storage is inaccessible,
    ingress is wrong, or authentication prevents the application from being useful.
- id: BLOCK6
  label: How I worked the problem.
  body: How I worked the problem.
