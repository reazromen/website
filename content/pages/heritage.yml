body: |
  <div class="culture-kicker"><span class="culture-live-dot"></span> FIELD NOTES / HERITAGE <span>PLACE · MATERIAL · MEMORY</span></div>

  Heritage is not simply a label for old buildings. It is the evidence, skills, places and shared meanings that people choose to carry forward—and the practical work required to do so responsibly.

  This collection starts in Bangladesh and looks at historic architecture, religious places, urban landscapes and conservation decisions. It distinguishes a site's documented history from later interpretation, and a proposal for recognition from formal World Heritage inscription.

  <div class="world-culture-stats" aria-label="Heritage collection scope">
