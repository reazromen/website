  ---

  <h2 class="culture-section-title"><span class="culture-section-icon"><svg class="tech-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-7h6v7M8 10h2M14 10h2"/></svg></span><span><small>FIELD NOTES / 01—05</small>Read the places, not just the monuments</span></h2>

  Each note begins with a defined subject and a traceable source. The collection includes UNESCO Tentative List entries, which are proposals submitted by a country—not confirmation that a place has been inscribed on the World Heritage List.

  <div class="culture-principles heritage-principles">
    <div><span class="culture-principle-mark">01 / MATERIAL</span><strong>Look closely</strong><p>Brick, lime mortar, terracotta, repairs and the surrounding landscape are evidence—not decoration.</p></div>
    <div><span class="culture-principle-mark">02 / CONTEXT</span><strong>Keep the setting</strong><p>A historic structure is connected to waterways, streets, worship, work and the people who use the place.</p></div>
    <div><span class="culture-principle-mark">03 / CARE</span><strong>Record before changing</strong><p>Conservation needs documentation, compatible methods, maintenance and honest explanation of uncertainty.</p></div>
  </div>

  ## Beyond the building

  Heritage can include a site's landscape, social use, craft knowledge and the accumulated traces of change. Conservation is not automatically the same as reconstruction, and making a place look new can erase evidence. Good interpretation explains what is known, what has changed and what remains uncertain.

  <p class="heritage-related-link"><a href="/archaeology.html">Explore Archaeology <span aria-hidden="true">↗</span></a><span>Excavated sites, material evidence and the questions researchers are still investigating.</span></p>
