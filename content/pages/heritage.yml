body: 'Heritage is more than a famous monument. It includes buildings, archaeological landscapes, historic
  streets, craft knowledge, archives and the living relationships people maintain with places. This collection
  looks at what survives, how it is interpreted, and the practical work of conserving it without stripping
  away its context.


  ## Start with Bangladesh


  - [Mahasthangarh: Reading Bangladesh’s Early Urban Past](/posts/mahasthangarh-reading-bangladeshs-early-urban-past.html)

  - [Paharpur: Somapura Mahavihara and a Wider Monastery Network](/posts/paharpur-somapura-mahavihara-and-a-monastery-network.html)

  - [Bagerhat and Khalifatabad: Water, Brick and a Medieval City](/posts/bagerhat-khalifatabad-water-and-the-medieval-city.html)

  - [Panam Nagar at Sonargaon: Reading a Historic Urban Landscape](/posts/panam-nagar-sonargaon-reading-a-historic-urban-landscape.html)


  ## How to read a heritage place


  Good heritage writing separates what can be observed from what is inferred. It considers original materials,
  later repairs, the surrounding landscape, community use and the evidence behind historical claims. Conservation
  is not simply making an old building look new; it is retaining the information and relationships that
  make a place meaningful.


  This archive will grow to include built heritage, landscapes, museums, conservation practice and community-led
  heritage from Bangladesh and other regions.'
