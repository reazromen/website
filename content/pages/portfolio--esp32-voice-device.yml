- id: BLOCK16
  label: Make the system observable enough to explain.
  body: Make the system observable enough to explain.
- id: BLOCK17
  label: The work produced a stable ESP32-S3 SIP/RTP voice path after iterating through
    audio timing, ch
  body: The work produced a stable ESP32-S3 SIP/RTP voice path after iterating through
    audio timing, channel routing, AEC, buffering and playback problems. The important
    result was not merely placing a call; it was making the complete media path observable
    enough to diagnose failures across layers.
