  body: Building and debugging a real-time voice device across firmware, codecs, audio
    timing, packet transport, PBX integration and hardware behavior.
- id: BLOCK3
  label: This project sits at the intersection of embedded firmware, audio engineering,
    networking, VoIP
  body: This project sits at the intersection of embedded firmware, audio engineering,
    networking, VoIP, hardware integration, and product engineering. The device uses
    an ESP32-S3 with ES7210 microphone and ES8311 speaker codecs, communicates over
    SIP/RTP, and connects to a PBX-based telephony backend.
- id: BLOCK4
  label: The symptom is not the layer.
  body: The symptom is not the layer.
- id: BLOCK5
  label: A call that connects is not necessarily a usable voice system. Crackle can
    originate in I2S sch
  body: A call that connects is not necessarily a usable voice system. Crackle can
    originate in I2S scheduling, buffer starvation, sample-rate conversion, clocking,
    RTP jitter, packet timing, codec configuration or playback. Echo can originate
    in acoustic coupling, AEC reference routing, channel mapping, gain or processing
    configuration.
- id: BLOCK6
  label: Trace the complete path.
  body: Trace the complete path.
- id: BLOCK7
  label: How I worked the problem.
  body: How I worked the problem.
