- id: BLOCK21
  label: Nomad can decide that an allocation belongs on another node before the storage
    system has safel
  body: Nomad can decide that an allocation belongs on another node before the storage
    system has safely detached, unpublished, and made its volume available there.
    Scheduler failover and storage failover are connected state machines.
