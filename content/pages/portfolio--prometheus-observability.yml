- id: BLOCK5
  label: During one high-CPU test, metrics correctly showed the load but the expected
    alert did not fire
  body: 'During one high-CPU test, metrics correctly showed the load but the expected
    alert did not fire. That distinction mattered: metric collection was working,
    while the alerting logic was not. PromQL label matching prevented the rule from
    evaluating as intended.'
