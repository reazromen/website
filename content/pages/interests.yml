title: Interests
browser_title: Interests — Reaz Romen
description: 'A growing collection of personal interests: archaeology, heritage, local and world cultures, music and cinema.'
url: /interests.html
draft: false
body: |
  <div class="page-hero compact-hero">
    <p class="eyebrow">BEYOND ENGINEERING / SIX AREAS</p>
    <h1>Interests</h1>
    <p class="lede">A broad, evolving collection of subjects worth exploring beyond engineering. Material history, living traditions, places, music and cinema meet here—grounded in sources where possible, open about uncertainty, and curious about how people make meaning across time and place.</p>
  </div>

  <section class="topic-strip interests-directory" aria-label="Explore interests">
    <div class="section-kicker"><span>Explore the collection</span><span>01—06</span></div>
    <div class="topic-grid">
      <a class="topic-card" href="/archaeology.html">
        <strong><span class="interest-index">01 / </span>Archaeology</strong>
        <span>Excavated sites, material evidence, ancient settlements, architecture and the questions researchers are still working through.</span>
        <span class="text-link">Explore Archaeology ↗</span>
      </a>
      <a class="topic-card" href="/heritage.html">
        <strong><span class="interest-index">02 / </span>Heritage</strong>
        <span>Historic buildings, monuments, landscapes, preservation and the choices involved in passing cultural places to future generations.</span>
        <span class="text-link">Explore Heritage ↗</span>
      </a>
      <a class="topic-card" href="/local-cultures.html">
        <strong><span class="interest-index">03 / </span>Local Cultures</strong>
        <span>Bangladesh’s regional identities, languages, foodways, crafts, festivals, oral histories and everyday traditions—documented with respect for the people who keep them alive.</span>
        <span class="text-link">Explore Local Cultures ↗</span>
      </a>
      <a class="topic-card" href="/world-cultures.html">
        <strong><span class="interest-index">04 / </span>World Cultures</strong>
        <span>Cultural histories and contemporary life across countries and regions, approached through context rather than stereotypes.</span>
        <span class="text-link">Explore World Cultures ↗</span>
      </a>
      <a class="topic-card" href="/music.html">
        <strong><span class="interest-index">05 / </span>Music</strong>
        <span>Songs, albums, performances and listening notes—along with the ideas, histories and feelings that make music worth returning to.</span>
        <span class="text-link">Explore Music ↗</span>
      </a>
      <a class="topic-card" href="/movies.html">
        <strong><span class="interest-index">06 / </span>Movies</strong>
        <span>Film notes on character, storytelling, mood, psychology and the questions a story leaves behind.</span>
        <span class="text-link">Explore Movies ↗</span>
      </a>
    </div>
  </section>
