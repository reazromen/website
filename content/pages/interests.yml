body: 'A broad, evolving collection of subjects worth exploring beyond engineering. This is where material
  history, living traditions, places, music and cinema meet: grounded in sources where possible, open
  about uncertainty, and curious about how people make meaning across time and place.


  ## Archaeology

  Explore excavated sites, material evidence, ancient settlements, architecture and the questions researchers
  are still working through.


  [Explore Archaeology →](/archaeology.html)


  ## Heritage

  Historic buildings, monuments, landscapes, preservation, and the choices involved in passing cultural
  places on to future generations.


  [Explore Heritage →](/heritage.html)


  ## Local Cultures

  Bangladesh’s regional identities, languages, foodways, crafts, festivals, oral histories and everyday
  traditions, documented with respect for the people who keep them alive.


  [Explore Local Cultures →](/local-cultures.html)


  ## World Cultures

  Cultural histories and contemporary life across countries and regions, approached through context rather
  than stereotypes.


  [Explore World Cultures →](/world-cultures.html)


  ## Music

  Songs, albums, performances and listening notes.


  [Explore Music →](/music.html)


  ## Movies

  Film notes on character, storytelling, mood, psychology and the questions a story leaves behind.


  [Explore Movies →](/movies.html)'
