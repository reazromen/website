- id: BLOCK0
  label: REAZ ROMEN / ABOUT
  body: REAZ ROMEN / ABOUT
- id: BLOCK1
  label: I’m Reaz Romen. I work at the seams between systems.
  body: I’m Reaz Romen. I work at the seams between systems.
- id: BLOCK2
  label: I’m a systems engineer who works across embedded devices, networks, real-time
    communications, b
  body: I’m a systems engineer who works across embedded devices, networks, real-time
    communications, backend services and infrastructure. I’m most useful when a product
    crosses several of those layers and the problem does not belong cleanly to one
    team or one tool.
- id: BLOCK3
  label: 'A lot of my work is hands-on: ESP32-S3 firmware and audio, SIP/RTP call
    paths, Linux and Docker'
  body: 'A lot of my work is hands-on: ESP32-S3 firmware and audio, SIP/RTP call paths,
    Linux and Docker systems, observability, ingress, service control and the glue
    between them. The same pattern keeps showing up — the symptom appears in one layer
    while the root cause lives somewhere else.'
- id: BLOCK4
  label: I prefer evidence over guesswork. I use serial logs, packet captures, timing
    measurements, metr
  body: I prefer evidence over guesswork. I use serial logs, packet captures, timing
    measurements, metrics, controlled A/B builds and known-good baselines. I preserve
    working states before changing them, and I document the path so the system can
    be understood again later.
- id: BLOCK5
  label: Connected firmware, real-time voice paths, Linux infrastructure and operational
    tooling.
  body: Connected firmware, real-time voice paths, Linux infrastructure and operational
    tooling.
- id: BLOCK6
  label: Known-good baselines, logs, packets, timing, metrics, controlled changes
    and repeatable tests.
  body: Known-good baselines, logs, packets, timing, metrics, controlled changes and
    repeatable tests.
- id: BLOCK7
  label: Problems that cross device, network, media, service and infrastructure boundaries.
  body: Problems that cross device, network, media, service and infrastructure boundaries.
- id: BLOCK8
  label: I do not fit neatly into one engineering box.
  body: I do not fit neatly into one engineering box.
- id: BLOCK9
  label: That is intentional. A connected product rarely fails according to an org
    chart. Firmware timin
  body: That is intentional. A connected product rarely fails according to an org
    chart. Firmware timing can surface as audio quality. SIP can succeed while RTP
    fails. A container can be “up” while the service is unusable. I like following
    the actual data path until the failure makes sense.
- id: BLOCK10
  label: 'Embedded: ESP32-S3, ESP-IDF/ADF, audio codecs, I2S/I2C, provisioning, OTA,
    controls and board b'
  body: '**Embedded:** ESP32-S3, ESP-IDF/ADF, audio codecs, I2S/I2C, provisioning,
    OTA, controls and board bring-up.'
- id: BLOCK11
  label: 'Voice: SIP, SDP, RTP, Asterisk, FreeSWITCH, OpenSIPS, Drachtio, endpoint
    and media-path debuggi'
  body: '**Voice:** SIP, SDP, RTP, Asterisk, FreeSWITCH, OpenSIPS, Drachtio, endpoint
    and media-path debugging.'
- id: BLOCK12
  label: 'Systems: Linux, Docker, ingress, observability, service health, logging,
