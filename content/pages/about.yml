- id: BLOCK1
  label: I’m Reaz Romen. I work at the seams between systems.
  body: I’m Reaz Romen. I work at the seams between systems.
- id: BLOCK2
  label: "I work across IoT, embedded systems, VoIP, telecommunications and Linux infrastructure."
  body: "I work across IoT, embedded systems, VoIP, telecommunications and Linux infrastructure. I also research and write about technology, engineering, science and the systems behind them. I’m most useful when a product crosses several layers and the problem does not belong cleanly to one team or one tool."
- id: BLOCK3
  label: "ESP32 firmware and audio, SIP/RTP call paths, FreeSWITCH, Docker, Kubernetes and observability."
  body: "A lot of my work is hands-on: ESP32-S3 firmware and audio, SIP/RTP call paths, Asterisk and FreeSWITCH, Linux services, Docker and Kubernetes, observability, ingress and the glue between them. The symptom often appears in one layer while the root cause lives somewhere else."
- id: BLOCK4
  label: I prefer evidence over guesswork. I use serial logs, packet captures, timing
    measurements, metr
  body: I prefer evidence over guesswork. I use serial logs, packet captures, timing
    measurements, metrics, controlled A/B builds and known-good baselines. I preserve
    working states before changing them, and I document the path so the system can
    be understood again later.
- id: BLOCK5
  label: "IoT and embedded devices, VoIP systems, infrastructure and technical writing."
  body: "IoT and embedded devices, VoIP systems, Linux infrastructure and technical writing."
- id: BLOCK6
  label: "SIP/RTP, FreeSWITCH, Asterisk, Docker, Kubernetes, logs, metrics and repeatable tests."
  body: "SIP/RTP, FreeSWITCH, Asterisk, Docker, Kubernetes, logs, metrics, controlled changes and repeatable tests."
- id: BLOCK7
  label: "Problems spanning device, network, media, service and infrastructure boundaries."
  body: "Problems spanning device, network, media, service and infrastructure boundaries."
- id: BLOCK8
  label: "I work across four connected areas."
  body: "I work across four connected areas."
- id: BLOCK9
  label: "Connected products rarely fail according to an org chart."
  body: "Connected products rarely fail according to an org chart. Firmware timing can surface as audio quality. SIP can succeed while RTP fails. A container can be running while its service remains unusable. I follow the actual data path until the failure makes sense."
- id: BLOCK10
  label: "IoT & Embedded Systems: ESP32-S3, ESP-IDF/ADF, audio codecs, connectivity, provisioning, OTA and board bring-up."
  body: "**IoT & Embedded Systems:** ESP32-S3, ESP-IDF/ADF, audio codecs, I2S/I2C, connectivity, provisioning, OTA, controls and board bring-up."
- id: BLOCK11
  label: "VoIP & Real-Time Communications: SIP, SDP, RTP, Asterisk, FreeSWITCH, OpenSIPS, Drachtio, PBX and media-path debugging."
  body: "**VoIP & Real-Time Communications:** SIP, SDP, RTP, Asterisk, FreeSWITCH, OpenSIPS, Drachtio, PBX, SIP trunks, routing and media-path debugging."
- id: BLOCK12
  label: "Linux, Containers & Infrastructure: Linux, Docker, Kubernetes, ingress, observability, health, logging and recovery."
  body: "**Linux, Containers & Infrastructure:** Linux, Docker, Kubernetes, ingress, observability, service health, logging, dependencies and recovery."
