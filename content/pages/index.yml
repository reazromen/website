blocks:
- id: BLOCK0
  label: Good day. I’m Reaz Romen, a systems architect working across communication
    systems, embedded de
  body: Good day. I’m Reaz Romen, a systems architect working across communication
    systems, embedded devices, and cloud infrastructure.
- id: BLOCK1
  label: 'Most of my work lives around Linux and telecom: SIP/RTP, WebRTC, FreeSWITCH,
    signaling and medi'
  body: 'Most of my work lives around Linux and telecom: SIP/RTP, WebRTC, FreeSWITCH,
    signaling and media flows, enterprise dialers, Kubernetes, and AI telephony systems.
    I like following the whole path—from an endpoint and signaling exchange to media,
    routing, backend services, infrastructure, and observability.'
- id: BLOCK2
  label: I also work closer to the hardware with ESP32 firmware, real-time audio,
    OTA, device fleets, an
  body: I also work closer to the hardware with ESP32 firmware, real-time audio, OTA,
    device fleets, and distributed systems. I’m a strong believer in Linux adoption
    and in systems you can inspect, trace, debug, and actually understand.
- id: BLOCK3
  label: I read a lot, and Carl Sagan has probably influenced me more than any other
    writer. That curios
  body: I read a lot, and Carl Sagan has probably influenced me more than any other
    writer. That curiosity about how things work is part of what pulled me toward
    Linux and open systems in the first place.
- id: BLOCK4
  label: Lately I’ve been going further down the stack into RF and satellite signals,
    Wi-Fi CSI, wireles
  body: Lately I’ve been going further down the stack into RF and satellite signals,
    Wi-Fi CSI, wireless PHY behavior, propagation, and Doppler. I’m also exploring
    coastal climate intelligence using satellite, hydrological, and environmental
    data.
- id: BLOCK5
  label: For fun, I’m experimenting with Reticulum over LoRa—low-bandwidth networking
    and resilient comm
  body: For fun, I’m experimenting with Reticulum over LoRa—low-bandwidth networking
    and resilient communication without assuming normal Internet infrastructure is
    always there.
