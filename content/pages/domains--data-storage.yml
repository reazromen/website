    Consistency Models Differ
- id: BLOCK21
  label: A lost counter, duplicate job, stale read, or runaway write bill is usually
    not 'a Cloudflare b
  body: A lost counter, duplicate job, stale read, or runaway write bill is usually
    not 'a Cloudflare bug.' Each storage primitive makes different consistency and
    delivery promises, so the same application pattern fails differently on each one.
- id: BLOCK22
  label: '2026-09-26'
  body: '2026-09-26'
- id: BLOCK23
  label: A Distributed Lock Without Fencing Can Let a Dead Worker Come Back and Corrupt
    State
  body: A Distributed Lock Without Fencing Can Let a Dead Worker Come Back and Corrupt
    State
- id: BLOCK24
  label: A lease can expire while its old owner is paused rather than dead. If that
    process later resume
  body: A lease can expire while its old owner is paused rather than dead. If that
    process later resumes, the lock service may have moved on—but the storage system
    can still accept stale writes unless it has a fencing mechanism.
- id: BLOCK25
  label: '2026-09-26'
  body: '2026-09-26'
- id: BLOCK26
  label: pgvector HNSW Can Return Fast Answers That Are Operationally Wrong
  body: pgvector HNSW Can Return Fast Answers That Are Operationally Wrong
- id: BLOCK27
  label: Approximate nearest-neighbor search is allowed to trade recall for speed.
    Add tenant or metadat
  body: Approximate nearest-neighbor search is allowed to trade recall for speed.
    Add tenant or metadata filters after the ANN scan and a fast query can return
    too few candidates without being a database error.
- id: BLOCK28
  label: '2026-09-26'
  body: '2026-09-26'
- id: BLOCK29
  label: PostgreSQL VACUUM Reclaims Space Without Giving the File Back to the Filesystem
  body: PostgreSQL VACUUM Reclaims Space Without Giving the File Back to the Filesystem
- id: BLOCK30
  label: 'Standard VACUUM makes dead-tuple space reusable inside a table. It usually
    does not shrink the '
  body: Standard VACUUM makes dead-tuple space reusable inside a table. It usually
    does not shrink the table file, which is why a successful vacuum and unchanged
    disk usage can both be correct.
- id: BLOCK31
  label: '2026-09-26'
  body: '2026-09-26'
- id: BLOCK32
  label: Why Observability Workloads Keep Ending Up in ClickHouse
  body: Why Observability Workloads Keep Ending Up in ClickHouse
- id: BLOCK33
  label: Logs and traces are wide, append-heavy events that are usually filtered by
    time and a few field
  body: Logs and traces are wide, append-heavy events that are usually filtered by
    time and a few fields, then aggregated. That workload shape explains the attraction
    to a columnar analytical database better than any benchmark headline.
- id: BLOCK34
  label: '2026-09-26'
  body: '2026-09-26'
- id: BLOCK35
  label: ZFS Scrub, Resilver, Snapshot, and Replication Solve Different Failure Modes
  body: ZFS Scrub, Resilver, Snapshot, and Replication Solve Different Failure Modes
- id: BLOCK36
  label: A scrub detects latent corruption, a resilver reconstructs missing redundancy,
    a snapshot prese
  body: A scrub detects latent corruption, a resilver reconstructs missing redundancy,
    a snapshot preserves an earlier dataset state, and replication puts that state
    somewhere else. Calling all four 'backup' hides the failures each one cannot solve.
- id: BLOCK37
  label: '2026-09-26'
  body: '2026-09-26'
