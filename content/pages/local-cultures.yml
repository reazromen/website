body: 'Culture is lived locally. Language, food, music, craft, festivals, work, memory and relationships
  to land and water can differ from one district or community to the next. This collection starts with
  Bangladesh and aims to document those differences without reducing any community to a single custom
  or stereotype.


  ## Bangladesh, region by region


  Future entries will explore regional languages and expressions, river and coastal livelihoods, food
  traditions, weaving and other crafts, seasonal festivals, oral histories and local knowledge. Each subject
  deserves its own context: who practises it, how it has changed, and what community members say it means.


  ## A careful approach


  Traditions are not frozen in the past. They change through migration, technology, trade, education,
  climate and generational choice. Where possible, articles should use local voices and credible sources,
  distinguish documented history from popular stories, and avoid treating a whole region as culturally
  uniform.


  This is the starting point for a growing archive of Bangladesh’s diverse local cultures.'
