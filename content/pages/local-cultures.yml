body: |
  Culture is lived locally. Language, food, music, craft, festivals, work, memory and relationships to land and water differ between communities and change over time. This collection starts with Bangladesh, documenting specific practices without treating any district or community as culturally uniform.

  The articles below use documented sources to explain how traditions are practised, how knowledge passes between generations, and why the people who sustain them matter. UNESCO listings provide useful reference points, but a listing is not a substitute for local voices or the full diversity of lived experience.

  ## Explore local cultures

  Read across craft, music, public celebration and urban visual culture. Each article distinguishes documented information from interpretation and points to its principal sources.

  ## Editorial approach

  Traditions are not frozen in the past. Migration, technology, trade, education, climate and generational choices shape them. These articles aim to avoid stereotypes, credit practitioners, and distinguish historical evidence from popular stories.
