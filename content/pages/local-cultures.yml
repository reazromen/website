  <div class="culture-kicker"><span class="culture-live-dot"></span> FIELD NOTES / BANGLADESH <span>COLLECTION 01—05</span></div>

  # Culture, seen up close

  Culture is not a museum label. It is knowledge carried by hands, voices, gatherings and streets—practised, adapted and passed on in everyday life.

  This collection looks closely at the people and systems behind Bangladesh's cultural traditions: the work that sustains a craft, the memory inside a song, the meaning of a procession and the art that moves through a city.

