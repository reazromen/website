  ---

  <h2 id="craft-and-material-knowledge" class="culture-section-title"><span class="culture-section-icon"><svg class="tech-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 9h16M9 4v16M15 4v16M4 15h16"/></svg></span><span><small>01 / MATERIAL KNOWLEDGE</small>Craft and material knowledge</span></h2>

  From Jamdani's intricate handloom patterns to the cool, flexible surface of Shital Pati, everyday materials hold specialised knowledge. Look beyond the finished object: at the technique, labour, tools, learning and economics that help a tradition endure.

  <h2 id="music-and-oral-tradition" class="culture-section-title"><span class="culture-section-icon"><svg class="tech-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 8l12-2M5 21a4 3 0 1 0 0-6 4 3 0 0 0 0 6ZM17 19a4 3 0 1 0 0-6 4 3 0 0 0 0 6Z"/></svg></span><span><small>02 / SOUND &amp; MEMORY</small>Music and oral tradition</span></h2>

  Songs travel through listening, memory, practice and performance. Baul traditions offer a way to explore how music carries philosophical questions and inherited knowledge while leaving room for personal interpretation and change.

  <h2 id="festivals-and-public-life" class="culture-section-title"><span class="culture-section-icon"><svg class="tech-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.5 5.5l13 13M18.5 5.5l-13 13M8 3l4 4 4-4M8 21l4-4 4 4"/></svg></span><span><small>03 / SHARED SPACE</small>Festivals and public life</span></h2>

  Mangal Shobhajatra turns making into a public act. Masks, large-scale forms, artists, students and audiences come together in a procession associated with the Bengali New Year—connecting creative work with shared civic space.

  <h2 id="urban-visual-culture" class="culture-section-title"><span class="culture-section-icon"><svg class="tech-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6M8 10h2M14 10h2"/></svg></span><span><small>04 / CITY &amp; STREET</small>Urban visual culture</span></h2>

  Dhaka's decorated rickshaws bring painting into the street. Their surfaces form a moving gallery shaped by artists, workshops, customers, urban movement and changing tastes—a reminder that cultural production is part of contemporary city life, too.

  ---

  ## The collection <span class="culture-count">05 STORIES · 2024</span>

  These articles combine documented context with interpretation. Each points to a principal source; they are not presented as field reporting or as substitutes for practitioners' own voices.

  ## Editorial principles

  <div class="culture-principles">
    <div><span class="culture-principle-mark">01</span><strong>Living traditions</strong><p>Practices evolve with migration, technology, trade, climate, markets and generational choices. They are not frozen relics.</p></div>
    <div><span class="culture-principle-mark">02</span><strong>Evidence before certainty</strong><p>Published and institutional sources are identified. Oral histories and popular accounts should be described honestly.</p></div>
    <div><span class="culture-principle-mark">03</span><strong>People before stereotypes</strong><p>No single craft, festival or musical tradition represents every person in a region. Skills exist within real social and economic conditions.</p></div>
  </div>

  ## A growing field notebook

  Future entries can follow regional language, foodways, river and coastal livelihoods, seasonal festivals, oral histories and local knowledge. The goal is to add specific places, sources and voices—not make broad claims about entire communities.
