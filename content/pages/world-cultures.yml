  <h2 class="culture-section-title"><span class="culture-section-icon"><svg class="tech-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 14 9l6 3-6 3-2 6-2-6-6-3 6-3z"/></svg></span><span><small>EDITORIAL STANDARD</small>Context before generalisation</span></h2>

  Cultural practices vary by region, class, generation, religion, language and personal choice. Articles should name their scope, draw on reliable sources and avoid presenting one person's experience as representative of an entire country.

  <div class="culture-principles">
    <div><span class="culture-principle-mark">01</span><strong>Name the context</strong><p>Identify the community, place, time period and practice under discussion instead of treating a country as a single cultural unit.</p></div>
    <div><span class="culture-principle-mark">02</span><strong>Separate evidence from interpretation</strong><p>Distinguish historical records and documented research from contemporary reporting, oral accounts and analysis.</p></div>
    <div><span class="culture-principle-mark">03</span><strong>Respect living voices</strong><p>Represent traditions as practices shaped by people today—not as exotic objects viewed from the outside.</p></div>
  </div>

  ## How this archive grows

  Entries will focus on a defined subject and identify useful sources. Regional categories help navigation; they do not replace the specific histories, languages and perspectives of the people concerned.

  This is an index for a growing collection of cultural histories and contemporary perspectives from around the world.
