  <h2 class="culture-section-title"><span class="culture-section-icon"><svg class="tech-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></span><span><small>REGIONAL INDEX / 01—07</small>Explore by region</span></h2>

  The archive is designed to grow through specific communities, places, periods and practices. These regional groupings are starting points, not claims that each region is culturally uniform.

