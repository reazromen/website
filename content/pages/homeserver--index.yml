  label: Broadcom Wi-Fi, routing and availability problems forced watchdog logic,
    NetworkManager recover
  body: Broadcom Wi-Fi, routing and availability problems forced watchdog logic, NetworkManager
    recovery and a more explicit failure model.
- id: BLOCK21
  label: Tailscale made the host a persistent private node. Cloudflare and Caddy separated
