title: An old Mac mini became my private infrastructure platform.
browser_title: Home Server — Living Infrastructure Notebook | Reaz Romen
description: A living engineering notebook documenting how an old Mac mini evolved
  into a private infrastructure platform for networking, observability, device infrastructure,
  sensing, environmental data and telephony R&D.
