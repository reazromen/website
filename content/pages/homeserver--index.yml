- id: BLOCK15
  label: I did not start by designing a “homelab architecture.” Wi-Fi failed, so I
    needed recovery. Remo
  body: I did not start by designing a “homelab architecture.” Wi-Fi failed, so I
    needed recovery. Remote access mattered, so I needed a private network. Too many
    services appeared, so I needed observability. Too many dashboards appeared, so
    I needed a control surface. Devices started producing data, so the server became
    a data backend. Firmware and telephony work needed infrastructure, so they joined
    the same platform.
- id: BLOCK16
  label: 'The page therefore doubles as a living engineering notebook: when a homeserver
    discussion chang'
  body: 'The page therefore doubles as a living engineering notebook: when a homeserver
    discussion changes the architecture, creates a new operational rule, or closes
    an open problem, the durable result belongs here.'
