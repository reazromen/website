  body: Tailscale made the host a persistent private node. Cloudflare and Caddy separated
    controlled web ingress from private management paths.
- id: BLOCK22
  label: Desktop, laptop and hserver became nodes with different capabilities and
    availability. Workload
  body: Desktop, laptop and hserver became nodes with different capabilities and availability.
    Workload placement and Nomad experiments followed.
