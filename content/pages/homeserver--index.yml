- id: BLOCK65
  label: Started treating expensive stacks as service groups with explicit on/off
    and maintenance behavi
  body: Started treating expensive stacks as service groups with explicit on/off and
    maintenance behavior after resource and log-pressure problems exposed the cost
    of leaving everything running.
