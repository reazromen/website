body: 'A personal space for exploring the traces people leave behind: places, objects, music and films.
  These collections look at material history, listening, storytelling, mood and the details that make
  a work worth revisiting.


  ## Archaeology


  Explore Bangladesh’s archaeological landscape through evidence, architecture, settlement patterns and
  the questions that remain open.


  [Explore Archaeology →](/archaeology.html)


  ## Music


  Songs, albums, performances and listening notes, with music kept at the center.


  [Explore Music →](/music.html)


  ## Movies


  Film notes on character, storytelling, mood, psychology and the questions a story leaves behind.


  [Explore Movies →](/movies.html)'
