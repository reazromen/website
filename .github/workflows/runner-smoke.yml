name: Runner smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runner-smoke.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Prove GitHub-hosted runner
        run: |
          uname -a
          node --version
          echo "github-hosted-runner-ok"
