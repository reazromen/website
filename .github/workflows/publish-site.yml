name: Build and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy-v2
  # Cancel stale queued/running deployments so a hung build cannot block publication.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install content renderer
        run: python -m pip install -r cms/requirements.txt
      - name: Render posts, pages, menus, taxonomy and feeds
        run: python cms/build_content.py
      - name: Assemble public files only
        run: python cms/package_public.py
      - name: Build search with current posts and tag filters
        run: npx --yes pagefind@1.5.2 --site dist
      - name: Add public article version editor
        run: |
          mkdir -p dist/assets
          cp assets/article-versioning-preview.js dist/assets/article-versioning-preview.js
          python - <<'PY'
          from pathlib import Path
          injection = '\n<script src="/assets/article-versioning-preview.js" defer></script>\n'
          count = 0
          for path in Path('dist').rglob('*.html'):
              html = path.read_text(encoding='utf-8', errors='ignore')
              if all(x in html for x in ('<article class="article"', 'class="article-meta"', 'class="lede"', 'class="prose"')) and '/assets/article-versioning-preview.js' not in html:
                  if '</body>' in html:
                      path.write_text(html.replace('</body>', injection + '</body>', 1), encoding='utf-8')
                      count += 1
          if count < 1:
              raise SystemExit('No article pages received the public version editor')
          print(f'Injected public version editor into {count} article pages')
          PY
      - name: Verify public artifact
        run: |
          test -s dist/index.html
          test -s dist/pagefind/pagefind.js
          test -s dist/sitemap.xml
          test ! -d dist/content
          test ! -d dist/cms
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete website
        id: deployment
        uses: actions/deploy-pages@v4


