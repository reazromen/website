name: Bootstrap current production source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-production.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download locked production snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://git-bootstrap.reazromen-static.pages.dev/public-site.tar.gz -o /tmp/public-site.tar.gz
          echo "34bad2197165fb3b0eab636e6cbc796f3a67db196f1aaf7a126a0d5c107399d8  /tmp/public-site.tar.gz" | sha256sum -c -
          mkdir -p /tmp/public-site
          tar -xzf /tmp/public-site.tar.gz -C /tmp/public-site
          test -s /tmp/public-site/index.html
          grep -Fq "Good day. I’m Reaz Romen" /tmp/public-site/index.html
          test -s /tmp/public-site/assets/site.css
          test ! -e /tmp/public-site/_worker.js
          test ! -e /tmp/public-site/admin

      - name: Replace repository public site
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/public-site/. .
          touch .nojekyll

      - name: Commit canonical production snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "production: bootstrap locked reazromen.com snapshot"
          git push origin HEAD:main
