name: Rebuild Pagefind index

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-pagefind
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild static search and tag filters
        run: npx --yes pagefind@1.5.2 --site .

      - name: Verify Pagefind output
        shell: bash
        run: |
          set -euo pipefail
          test -s pagefind/pagefind.js
          grep -Fq 'pagefind_version="1.5.2"' pagefind/pagefind.js

      - name: Commit refreshed index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pagefind
          if git diff --cached --quiet; then
            echo "Pagefind index already current."
            exit 0
          fi
          git commit -m "search: rebuild Pagefind index"
          git push origin HEAD:main
