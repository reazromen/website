name: Build CMS content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "cms/build_content.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cms-content
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tiny renderer dependencies
        run: python3 -m pip install --quiet pyyaml markdown

      - name: Render structured CMS content
        run: python3 cms/build_content.py

      - name: Commit generated website files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts index.html music.html perspectives.html bangla.html
          if git diff --cached --quiet; then
            echo "CMS-rendered site is already current."
            exit 0
          fi
          git commit -m "cms: render structured content"
          git push origin HEAD:main
