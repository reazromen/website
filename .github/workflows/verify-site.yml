name: Verify public site source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical static source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s about.html
          test -s writing.html
          test -s systems.html
          test -s assets/site.css
          test -s assets/navigation.json
          test -s .pages.yml
          test ! -e _worker.js
          test ! -e _routes.json
          test ! -d admin
          python3 -m json.tool assets/navigation.json >/dev/null
          node --check assets/sitewide.js
          node --check assets/phase1.js
          node --check assets/responsive-v3.js
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path('.pages.yml').read_text())
          assert isinstance(data, dict)
          assert data.get('content')
          assert data.get('media')
          print('Pages CMS configuration parsed successfully')
          PY
          count="$(find . -type f ! -path './.git/*' | wc -l | tr -d ' ')"
          echo "tracked/static file count: $count"
          test "$count" -gt 2000

      - name: Build and verify canonical SEO output
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -r cms/requirements.txt
          python cms/build_content.py
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlsplit

          homepage = Path('index.html').read_text(encoding='utf-8')
          assert 'rel="canonical"' in homepage and 'href="https://reazromen.com/" rel="canonical"' in homepage, 'Homepage canonical must be the root URL'

          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root = ET.parse('sitemap.xml').getroot()
          urls = [node.text.strip() for node in root.findall('sm:url/sm:loc', ns)]
          assert 'https://reazromen.com/' in urls, 'Sitemap must include the canonical homepage'
          assert len(urls) == len(set(urls)), 'Sitemap contains duplicate URLs'

          aliases = []
          for value in urls:
              path = urlsplit(value).path
              if path.endswith('/index.html'):
                  candidate = path[:-len('/index.html')] + '.html'
                  if (Path('.') / candidate.lstrip('/')).is_file():
                      aliases.append(value)
          assert not aliases, 'Sitemap contains index aliases with existing .html counterparts: ' + ', '.join(aliases[:20])
          print(f'Canonical SEO checks passed for {len(urls)} sitemap URLs.')
          PY
