name: Verify public site source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical static source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s about.html
          test -s writing.html
          test -s systems.html
          test -s assets/site.css
          test -s assets/navigation.json
          test -s .pages.yml
          test ! -e _worker.js
          test ! -e _routes.json
          test ! -d admin
          python3 -m json.tool assets/navigation.json >/dev/null
          node --check assets/sitewide.js
          node --check assets/phase1.js
          node --check assets/responsive-v3.js
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path('.pages.yml').read_text())
          assert isinstance(data, dict)
          assert data.get('content')
          assert data.get('media')
          print('Pages CMS configuration parsed successfully')
          PY
          count="$(find . -type f ! -path './.git/*' | wc -l | tr -d ' ')"
          echo "tracked/static file count: $count"
          test "$count" -gt 2000

      - name: Install and validate CMS sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet -r cms/requirements.txt
          python3 cms/validate_content.py

      - name: Rebuild generated content and validate sitemap
        shell: bash
        run: |
          set -euo pipefail
          python3 cms/build_content.py
          python3 cms/validate_content.py
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from bs4 import BeautifulSoup
          import sys
          sys.path.insert(0, "cms")
          from build_content import load_all, ROOT, target

          manifest = json.loads((ROOT / "cms/generated-manifest.json").read_text())
          sitemap = (ROOT / "sitemap.xml").read_text()
          locs = set(re.findall(r"<loc>(.*?)</loc>", sitemap))
          urls = set(manifest)
          assert "/posts/test.html" not in urls, "test draft leaked into generated manifest"
          assert "https://reazromen.com/posts/test.html" not in locs, "test draft leaked into sitemap"
          assert all(u.startswith("https://reazromen.com/") for u in locs), "sitemap contains non-canonical host"
          assert all(u.removeprefix("https://reazromen.com") in urls for u in locs), "sitemap URL missing from generated manifest"
          assert all(target(u).exists() for u in urls), "manifest references missing generated output"
          entries, pages, tax, nav, owned = load_all()
          non_indexable = {
              u for m in entries if not m.get("draft") and m.get("indexable") is False
              for u in ({m["url"]} | {o["url"] for o in m.get("outputs", [])})
          }
          for ident, tag in tax["tags"].items():
              count = sum(1 for m in entries if not m.get("draft") and ident in m.get("tags", []))
              if count < 3 and not str(tag.get("description", "")).strip() and not str(tag.get("body", "")).strip():
                  non_indexable.add("/tags/" + ident + ".html")
                  non_indexable.update(tag.get("aliases", []))
          assert not any("https://reazromen.com" + u in locs for u in non_indexable), "non-indexable URL leaked into sitemap"
          # A post without body-level internal links should receive a small, relevant related-reading block.
          candidate = next((m for m in entries if not m.get("draft") and (m.get("tags") or m.get("topic")) and not re.search(r"\\]\\(/|<a\\b[^>]+href=[\\\"\\']", m.get("body", ""), re.I)), None)
          assert candidate, "no candidate post found for related-reading test"
          rendered = BeautifulSoup(target(candidate["url"]).read_text(), "html.parser")
          related = rendered.select_one("main > section.related-reading")
          assert related, f"missing related-reading block for {candidate['url']}"
          related_urls = [a.get("href") for a in related.select(".post-card h3 a[href]")]
          assert 1 <= len(related_urls) <= 3, "related-reading block must contain one to three article links"
          assert all(u in urls and u != candidate["url"] for u in related_urls), "related-reading links must target other generated articles"
          for u in non_indexable:
              p = target(u)
              if p.exists():
                  robots = BeautifulSoup(p.read_text(), "html.parser").find("meta", attrs={"name": "robots"})
                  assert robots and "noindex" in robots.get("content", "").lower(), f"missing noindex for {u}"
          print(json.dumps({
              "manifest_urls": len(urls),
              "sitemap_urls": len(locs),
              "published_posts": len([m for m in entries if not m.get("draft")]),
              "tag_archives": len(tax["tags"]),
              "selective_tag_policy": "verified",
              "test_page_excluded": True,
              "non_indexable_sitemap_exclusions": len(non_indexable),
          }))
          PY
